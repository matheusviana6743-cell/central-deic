name: Validar CENTRAL-DEIC
on:
  push:
    branches: [main, feat/mega-atualizacao]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Montar pacote para atualização da Discloud
        run: |
          git archive --format=zip --output=central-deic-discloud-paineis-r7.zip HEAD -- bot.js register.js backup.js archive.js catalog.js deic.js desks.js guides.js intake.js panel.js records.js setup.js wipe.js academy.js curriculum.js participation.js mesa-panel.js forms.js form-model.js form-media.js organization.js template.js template-panels.js template-panel-model.js navigation.js interaction-auth.js package.json package-lock.json discloud.config README.md DEIC-TRAVESSIA.md RELEASE.md api database public
      - uses: actions/upload-artifact@v4
        with:
          name: central-deic-discloud-paineis-r7
          path: central-deic-discloud-paineis-r7.zip
          if-no-files-found: error
          retention-days: 7
